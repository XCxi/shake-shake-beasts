<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>震震萌兽 · 一敲全塌</title>
<meta name="theme-color" content="#120f24">
<meta name="description" content="敲一下，冲击波扩散开，整堆萌兽被掀起来互撞，撞得够狠就合成更大一只。敲击次数有限，看你能炸出多少连锁。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E%F0%9F%94%A8%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 0%,#2b2150 0%,#171232 45%,#0a0813 100%);color:#f6f4ff;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);
  display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px)}
.hud{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:0 2px 6px;flex:0 0 auto}
.pill{flex:1;min-width:0;text-align:center;padding:6px 4px;border-radius:999px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cfc9ee}
.pill b{color:#fff;font-size:13.5px}
.pill.hot{background:linear-gradient(180deg,#ffcf6b,#ff9d3c);border-color:#ffe0a0;color:#3a2200}
.pill.hot b{color:#3a2200}
.pill.low{background:rgba(255,90,90,.22);border-color:rgba(255,140,140,.5);color:#ffd9d9}
.icon{width:36px;height:34px;flex:0 0 auto;border-radius:12px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);color:#fff;font-size:15px;cursor:pointer}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;cursor:crosshair}
canvas{display:block;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.foot{display:flex;gap:8px;padding-top:8px;flex:0 0 auto}
.foot button{flex:1;padding:11px 6px;border-radius:14px;font-size:13.5px;color:#fff;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.16)}
.foot button:active{transform:scale(.97)}
.overlay{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(8,6,18,.74);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .22s}
.overlay.show{opacity:1;pointer-events:auto}
.card{width:min(372px,100%);max-height:88vh;overflow:auto;text-align:center;border-radius:22px;padding:22px 18px 18px;
  background:linear-gradient(170deg,#282152,#161325);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 24px 60px rgba(0,0,0,.6);transform:translateY(10px) scale(.98);transition:transform .24s ease}
.overlay.show .card{transform:none}
.card h1{margin:0 0 4px;font-size:23px;letter-spacing:1.5px}
.card .sub{margin:0 0 12px;font-size:12px;color:#9d97c4;letter-spacing:1px}
.card p{margin:0 0 12px;font-size:13.5px;line-height:1.75;color:#cbc6e8}
.card p b{color:#ffd98a}
.btn{display:block;width:100%;margin:8px 0 0;padding:13px;border-radius:16px;font-size:15px;font-weight:600;font-family:inherit;
  color:#241a06;cursor:pointer;border:0;background:linear-gradient(180deg,#ffe6a8,#ffc65e)}
.btn.ghost{color:#eee9ff;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));
  border:1px solid rgba(255,255,255,.16);font-weight:500}
.btn:active{transform:scale(.98)}
.rules{text-align:left;font-size:12.5px;line-height:1.9;color:#bdb7dd;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin:0 0 6px}
.ladder{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:17px;margin:2px 0 10px;line-height:1.4}
.toast{position:fixed;left:50%;top:24%;transform:translate(-50%,6px) scale(.9);z-index:9500;pointer-events:none;
  padding:9px 18px;border-radius:999px;font-size:15px;font-weight:700;color:#ffe9a8;max-width:88vw;text-align:center;
  background:rgba(20,16,36,.88);border:1px solid rgba(255,255,255,.18);opacity:0;transition:all .22s ease}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.tools{display:flex;gap:8px;padding-top:6px;flex:0 0 auto}
.tools button{flex:1;padding:9px 6px;border-radius:14px;font-size:13px;color:#fff;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14)}
.tools button b{color:#ffd98a}
.tools button.on{background:linear-gradient(180deg,#ffd98a,#ff9d3c);border-color:#ffe6b0;color:#3a2200}
.tools button.on b{color:#3a2200}
.tools button:disabled{opacity:.35;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:4px 0 8px}
.cell{aspect-ratio:1/1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);cursor:pointer;color:#fff;font-family:inherit;
  font-size:14px;font-weight:600;padding:4px}
.cell small{font-size:10px;letter-spacing:-1px;color:#ffd98a;font-weight:400}
.cell.locked{opacity:.32;cursor:not-allowed}
.cell.best{border-color:#ffd98a;background:rgba(255,217,138,.16)}
.gal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 10px}
.gal div{aspect-ratio:1/1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.16);filter:grayscale(1) brightness(.45)}
.gal div.has{filter:none;background:rgba(255,255,255,.13);border-style:solid;border-color:rgba(255,255,255,.4)}
.hint{font-size:11.5px;color:#9d97c4;margin:2px 0 8px}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="pill">第 <b id="hLevel">1</b> 关</div>
    <div class="pill">分数 <b id="hScore">0</b> / <span id="hTarget">0</span></div>
    <div class="pill" id="hTaps">🔨 <b>0</b></div>
    <div class="pill" id="hChain">连锁 —</div>
    <button class="icon" id="btnSound" title="音效">🔊</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="tools">
    <button class="tool" id="btnHeavy" title="每关 1 次：范围更大、威力更猛的一锤">💥 重锤 <b>1</b></button>
    <button class="tool" id="btnMagnet" title="每关 1 次：把这一圈的萌兽朝落点吸过来">🧲 磁锤 <b>1</b></button>
  </div>
  <div class="foot">
    <button id="btnRestart">🔄 重敲本关</button>
    <button id="btnDaily">🔥 今日挑战</button>
  </div>
</div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>
<script>
(function(){
'use strict';

/*==PHYS==*/
/* 纯物理核心：不碰 DOM，可抽出来单独跑仿真。allowMerge=false 时只堆叠不合成（用来堆关卡初始局面） */
var FIELD={W:400,H:620,WALL:8,GRAV:2000,REST:0.12,FRIC:0.24,MAXV:2000,MERGE_V:145};
var CHAIN=[
  {e:'\uD83D\uDC2D',r:14,c1:'#fff4d8',c2:'#e6ba75'},
  {e:'\uD83D\uDC30',r:19,c1:'#ffe8f1',c2:'#ffa4c3'},
  {e:'\uD83D\uDC31',r:25,c1:'#fff2d4',c2:'#ffbc5e'},
  {e:'\uD83D\uDC36',r:32,c1:'#fff8dc',c2:'#ffcc68'},
  {e:'\uD83E\uDD8A',r:40,c1:'#ffe7d2',c2:'#ff974d'},
  {e:'\uD83D\uDC28',r:49,c1:'#eef2ff',c2:'#a9b6ff'},
  {e:'\uD83D\uDC3C',r:59,c1:'#f4f4ff',c2:'#bfbff0'},
  {e:'\uD83D\uDC2F',r:70,c1:'#ffedc4',c2:'#ffaa28'},
  {e:'\uD83E\uDD81',r:82,c1:'#fff0b8',c2:'#ffc234'},
  {e:'\uD83D\uDC32',r:95,c1:'#e2f8ff',c2:'#54c6ff'}
];
var BID=1;
function makeBall(lv,x,y,vx,vy){
  return {id:BID++,lv:lv,r:CHAIN[lv].r,x:x,y:y,vx:vx||0,vy:vy||0,spin:0,age:0,dead:false,squash:0,fresh:false};
}
function integrate(balls,dt){
  for(var i=0;i<balls.length;i++){
    var b=balls[i]; if(b.dead) continue;
    b.vy+=FIELD.GRAV*dt;
    b.vx*=0.9994; b.vy*=0.9994;
    var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(sp>FIELD.MAXV){ b.vx*=FIELD.MAXV/sp; b.vy*=FIELD.MAXV/sp; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.spin+=b.vx*dt*0.012;
  }
}
function collide(balls,ev,add,allowMerge){
  var n=balls.length, CORR=0.92;
  for(var i=0;i<n;i++){
    var a=balls[i]; if(a.dead) continue;
    for(var j=i+1;j<n;j++){
      var b=balls[j]; if(b.dead) continue;
      var dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d2=dx*dx+dy*dy;
      if(d2>=rr*rr) continue;
      var d=Math.sqrt(d2)||0.0001, nx=dx/d, ny=dy/d, pen=rr-d;
      var rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nx+rvy*ny;      /* vn<0 表示正在靠近 */
      if(allowMerge&&a.lv===b.lv&&a.lv<CHAIN.length-1&&(-vn)>(FIELD.MERGE_V_NOW||FIELD.MERGE_V)){   /* 撞得够狠才合成 */
        a.dead=true; b.dead=true;
        var nl=a.lv+1, mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5;
        add.push({id:BID++,lv:nl,r:CHAIN[nl].r,x:mx,y:my,vx:(a.vx+b.vx)*0.5,vy:(a.vy+b.vy)*0.5,spin:0,age:0,dead:false,squash:1,fresh:true});
        ev.merges.push({lv:nl,x:mx,y:my});
        continue;
      }
      var Ma=a.r*a.r, Mb=b.r*b.r, tm=Ma+Mb;
      var wa=Mb/tm, wb=Ma/tm;
      if(a.fresh&&!b.fresh){ wa=0.10; wb=0.90; }        /* 刚合出来的大球自己让位，别把整堆顶飞 */
      else if(b.fresh&&!a.fresh){ wa=0.90; wb=0.10; }
      var push=Math.min(pen*CORR,Math.min(a.r,b.r)*0.85);
      a.x-=nx*push*wa; a.y-=ny*push*wa;
      b.x+=nx*push*wb; b.y+=ny*push*wb;
      if(vn<-4){
        var invSum=1/Ma+1/Mb;
        var j=-(1+FIELD.REST)*vn/invSum, s=Math.min(1,-vn/1400);
        a.vx-=nx*j/Ma; a.vy-=ny*j/Ma;
        b.vx+=nx*j/Mb; b.vy+=ny*j/Mb;
        var tx=-ny, ty=nx, vt=rvx*tx+rvy*ty, jt=-vt/invSum, maxJt=FIELD.FRIC*Math.abs(j);
        jt=Math.max(-maxJt,Math.min(maxJt,jt));
        a.vx-=tx*jt/Ma; a.vy-=ty*jt/Ma;
        b.vx+=tx*jt/Mb; b.vy+=ty*jt/Mb;
        if(s>0.15){ a.squash=Math.max(a.squash,s); b.squash=Math.max(b.squash,s); }
      }
    }
  }
}
function walls(balls){
  var W=FIELD.W,H=FIELD.H,w=FIELD.WALL;
  for(var i=0;i<balls.length;i++){
    var b=balls[i]; if(b.dead) continue;
    if(b.x-b.r<w){ b.x=w+b.r; if(b.vx<0) b.vx=-b.vx*FIELD.REST; }
    else if(b.x+b.r>W-w){ b.x=W-w-b.r; if(b.vx>0) b.vx=-b.vx*FIELD.REST; }
    if(b.y+b.r>H-w){
      b.y=H-w-b.r;
      if(b.vy>0){ if(b.vy>60) b.squash=Math.max(b.squash,Math.min(1,b.vy/900)); b.vy=-b.vy*FIELD.REST; }
      b.vx*=0.9;
    }
    if(b.y-b.r<-90){ b.y=-90+b.r; if(b.vy<0) b.vy=0; }
  }
}
function cull(balls){ for(var i=balls.length-1;i>=0;i--) if(balls[i].dead) balls.splice(i,1); }
function physicsStep(balls,dt,ev,allowMerge,passes){
  ev=ev||{}; ev.merges=[];
  var SUB=3, h=dt/SUB, PASSES=passes||12;
  for(var s=0;s<SUB;s++){
    integrate(balls,h);
    var add=[];
    for(var pi=0;pi<PASSES;pi++) collide(balls,ev,add,allowMerge);
    for(var k=0;k<add.length;k++) balls.push(add[k]);
    walls(balls);
    cull(balls);
  }
  for(var i=0;i<balls.length;i++){ var b=balls[i]; b.age+=dt; b.fresh=false; if(b.squash>0) b.squash=Math.max(0,b.squash-dt*3.5); }
  return ev;
}
function settled(balls,th){
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(Math.abs(b.vx)>th||Math.abs(b.vy)>th) return false;
  }
  return true;
}
/* 纯位置去重叠：兜底把互相埋住的球推开，保证画面里球是圆的 */
function deOverlap(balls,iters){
  for(var it=0;it<iters;it++){
    var moved=false;
    for(var i=0;i<balls.length;i++){
      for(var j=i+1;j<balls.length;j++){
        var a=balls[i], b=balls[j];
        var dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d=Math.sqrt(dx*dx+dy*dy)||0.001;
        if(d>=rr) continue;
        var pen=rr-d, nx=dx/d, ny=dy/d, Ma=a.r*a.r, Mb=b.r*b.r, tm=Ma+Mb;
        a.x-=nx*pen*(Mb/tm); a.y-=ny*pen*(Mb/tm);
        b.x+=nx*pen*(Ma/tm); b.y+=ny*pen*(Ma/tm);
        moved=true;
      }
    }
    walls(balls);
    if(!moved) break;
  }
}
/* 出生点是否干净：顶部 120px 内不能有球，否则两只新球会套在一起 */
function spawnClear(balls){
  for(var i=0;i<balls.length;i++) if(balls[i].y-balls[i].r<120) return false;
  return true;
}
function perfectScore(counts){
  var c=counts.slice(), s=0;
  for(var lv=0;lv<c.length-1;lv++){
    var m=Math.floor(c[lv]/2);
    s+=m*((lv+1)*(lv+2)/2);
    c[lv+1]+=m;
  }
  return s;
}
/*==/PHYS==*/

/* ================= 关卡设计 ================= */
/*==GAME==*/
var TOTAL_LEVELS=15;
/* 目标分 = 实测"多种子平均得分 × 50%"，且不超过最差运气的 85%，用 _test.js 的 CALIB=2 标定 */
var TARGETS=[50,55,60,65,115,125,140,160,175,180,185,190,195,200,205];
function planFor(level){
  var lv=Math.max(1,Math.min(TOTAL_LEVELS,level));
  var types=Math.min(5,3+Math.floor(lv/5));                       /* 3 → 5 种：种类少，同款才凑得起来 */
  var per=(lv<=4)?6:6;                                            /* 每种 6 只：球多才有连锁可炸，也压住运气方差 */
  var counts=[],i;
  for(i=0;i<types;i++) counts.push(per);
  var perfect=perfectScore(counts);
  var taps=Math.max(6,12-Math.floor(lv/3));
  var target=TARGETS[lv-1];
  return {counts:counts,perfect:perfect,taps:taps,target:target,count:types*per,types:types,per:per};
}
function buildPile(plan){
  var types=plan.counts.length, per=plan.counts[0], list=[], lv, r, i;
  /* 轮流投放，并让每种萌兽落在自己那条竖带上：敲一个区域能带出一串，而不是纯靠运气 */
  for(r=0;r<per;r++) for(lv=0;lv<types;lv++) list.push(lv);
  var pad=FIELD.WALL+44, bw=(FIELD.W-2*pad)/types;
  var balls=[],ev={},dt=1/120;
  for(i=0;i<list.length;i++){
    var t=list[i];
    for(var g=0;g<900;g++){                       /* 等出生点空出来再丢下一只 */
      if(spawnClear(balls)) break;
      physicsStep(balls,dt,ev,false,4);
    }
    var x=pad+t*bw+bw*0.5+(rnd()-0.5)*bw*0.7;
    x=Math.max(pad,Math.min(FIELD.W-pad,x));
    balls.push(makeBall(t,x,30,0,90));
    for(var k=0;k<900;k++){
      physicsStep(balls,dt,ev,false,4);           /* 堆局面时不合成 */
      if(settled(balls,26)) break;
    }
  }
  deOverlap(balls,60);                            /* 兜底：把残余的互相埋住推开 */
  for(var s=0;s<120;s++) physicsStep(balls,dt,ev,false);
  deOverlap(balls,40);
  return balls;
}
/*==/GAME==*/

/* ================= 存档 / 工具 ================= */
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var soundOn=LS.get('zz_sound',true);
var bestLevel=Math.min(Math.max(1,LS.get('zz_best',1)|0),TOTAL_LEVELS);
var rnd=Math.random;
function seedRnd(seed){ var a=seed>>>0; rnd=function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

/* ================= 音效 ================= */
var AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){AC=null} } if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}} return AC; }
function beep(f,dur,type,vol,delay){
  if(!soundOn) return; var a=ac(); if(!a) return;
  var t=a.currentTime+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||.1,t+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03);
}
var SCALE=[523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5,1568,1760,2093,2349.3];
var sfx={
  tap:function(){ beep(110,.22,'sine',.16); beep(320,.07,'square',.05); },
  merge:function(lv,chain){
    beep(SCALE[Math.min(SCALE.length-1,lv)],.20,'sine',.11);
    beep(SCALE[Math.min(SCALE.length-1,lv)]*2,.12,'triangle',.05,.02);
    if(chain>1) beep(SCALE[Math.min(SCALE.length-1,lv)]*1.5,.16,'sine',.07,.05);
  },
  clear:function(){ var s=[659,784,988,1319]; for(var i=0;i<s.length;i++) beep(s[i],.3,'sine',.11,i*.1); },
  fail:function(){ var s=[392,330,262]; for(var i=0;i<s.length;i++) beep(s[i],.32,'triangle',.09,i*.14); }
};

/* ================= DOM ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
var hLevel=document.getElementById('hLevel'), hScore=document.getElementById('hScore'), hTarget=document.getElementById('hTarget');
var hTaps=document.getElementById('hTaps'), hChain=document.getElementById('hChain');
var btnSound=document.getElementById('btnSound'), overlay=document.getElementById('overlay'), card=document.getElementById('card');
var btnHeavy=document.getElementById('btnHeavy'), btnMagnet=document.getElementById('btnMagnet');
var S=null, aim={x:FIELD.W/2,y:FIELD.H*0.55}, scale=1, lastTapT=0;
/* 存档：每关星级 + 图鉴点亮 */
var stars=LS.get('zz_stars',{}) || {};
var seen=LS.get('zz_seen',[]) || [];
if(!seen[0]){ seen[0]=1; }                        /* 🐭 是最基础的，一开始就算点亮 */
function saveStars(){ LS.set('zz_stars',stars); }
function saveSeen(){ LS.set('zz_seen',seen); }

function fit(){
  var w=stage.clientWidth, h=stage.clientHeight;
  scale=Math.min(w/FIELD.W,h/FIELD.H);
  if(!isFinite(scale)||scale<=0) scale=1;
  var dpr=Math.min(2,window.devicePixelRatio||1);
  cv.style.width=(FIELD.W*scale)+'px'; cv.style.height=(FIELD.H*scale)+'px';
  cv.width=Math.max(1,Math.round(FIELD.W*scale*dpr));
  cv.height=Math.max(1,Math.round(FIELD.H*scale*dpr));
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
}
window.addEventListener('resize',fit);

/* ================= 关卡流程 ================= */
function startLevel(level,mode,seed){
  var plan=planFor(level);
  seedRnd(seed==null?((Math.random()*1e9)|0):seed);
  var balls=buildPile(plan);
  S={level:level,mode:mode||'campaign',balls:balls,ev:{merges:[]},fx:[],waves:[],score:0,target:plan.target,
     taps:plan.taps,tapsUsed:0,chain:0,chainT:0,shake:0,frozen:false,over:false,endT:0,t:0,plan:plan,merges:0,
     heavy:1,magnet:1,armed:null,stars:0,mergeBoost:0};
  updateHud(); hideCard(); ac(); fit();
  toast('第 '+level+' 关 · 目标 '+plan.target+' 分 · 可敲 '+plan.taps+' 次');
}
function updateHud(){
  if(!S) return;
  hLevel.textContent=S.mode==='daily'?'今日':S.level;
  hScore.textContent=S.score;
  hTarget.textContent=S.target;
  hTaps.innerHTML='🔨 <b>'+S.taps+'</b>';
  hTaps.className='pill'+(S.taps<=1?' low':(S.taps<=3?' hot':''));
  hChain.textContent='连锁 x'+Math.max(1,S.chain);

  btnMagnet.innerHTML='🧲 磁锤 <b>'+S.magnet+'</b>';

  btnHeavy.className='tool'+(S.armed==='heavy'?' on':'');
  btnMagnet.className='tool'+(S.armed==='magnet'?' on':'');
}

/* ================= 敲击：扩散的冲击波 ================= */
/*==GAME2==*/
/* kind: 不传就是普通敲；'heavy' 重锤（范围/威力更大）；'magnet' 磁锤（把这一圈朝落点吸） */
function knock(x,y,forceKind){
  if(!S||S.over||S.frozen) return;
  var kind=forceKind||S.armed||'normal';
  if(kind==='heavy'&&S.heavy<=0) kind='normal';
  if(kind==='magnet'&&S.magnet<=0) kind='normal';
  if(kind==='normal'){
    if(S.taps<=0) return;
    S.taps--;
  }else if(kind==='heavy'){ S.heavy--; S.armed=null; }
  else { S.magnet--; S.armed=null; S.mergeBoost=1.1; }   /* 磁锤：吸成一团，并且短时间内轻碰也能合体 */
  S.tapsUsed++; lastTapT=S.t;
  var w;
  if(kind==='heavy')       w={x:x,y:y,r:26,max:300,speed:1150,power:1180,dir:1,hit:{},kind:kind};
  else if(kind==='magnet') w={x:x,y:y,r:18,max:265,speed:1000,power:1150,dir:-1,hit:{},kind:kind};
  else                     w={x:x,y:y,r:22,max:205,speed:1080,power:760,dir:1,hit:{},kind:'normal'};
  S.waves.push(w);
  S.shake=Math.min(1,S.shake+.55+(kind==='heavy'?.35:0));
  if(kind==='magnet') beep(300,.25,'sine',.12);
  else if(kind==='heavy') beep(70,.35,'sine',.22);
  sfx.tap(); updateHud();
  if(kind==='heavy') toast('💥 重锤！');
  else if(kind==='magnet') toast('🧲 磁力碾压：吸成一团，轻碰也合体');
}
function stepWaves(dt){
  for(var i=S.waves.length-1;i>=0;i--){
    var w=S.waves[i];
    w.r+=w.speed*dt;
    for(var j=0;j<S.balls.length;j++){
      var b=S.balls[j];
      if(w.hit[b.id]) continue;
      var dx=b.x-w.x, dy=b.y-w.y, d=Math.sqrt(dx*dx+dy*dy)||.001;
      if(d-b.r>w.r) continue;                       /* 波前还没扫到它 */
      w.hit[b.id]=1;
      var fall=w.dir<0?Math.max(.15,1-.55*d/w.max):Math.max(0,1-d/w.max);
      if(fall<=0) continue;
      var f=w.power*fall*Math.pow(18/b.r,0.55);
      if(w.dir<0){                                  /* 磁锤：朝落点吸过去 */
        b.vx-=dx/d*f*1.35; b.vy-=dy/d*f*1.35;
      }else{
        b.vx+=dx/d*f; b.vy+=dy/d*f-f*.32;           /* 顺带往上抛一点，看着才爽 */
      }
      b.squash=Math.min(1,b.squash+fall*.7);
    }
    if(w.r>w.max) S.waves.splice(i,1);
  }
}

/* ================= 合成特效 ================= */
function addFx(x,y,lv,gain,chain){
  var col=CHAIN[lv].c2;
  S.fx.push({t:'ring',x:x,y:y,r:CHAIN[lv].r*.5,max:CHAIN[lv].r*2.3,age:0,life:.42,c:col});
  var n=8+lv*2;
  for(var i=0;i<n;i++){
    var a=rnd()*6.2832, sp=80+rnd()*240;
    S.fx.push({t:'p',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-70,r:1.6+rnd()*2.6,age:0,life:.45+rnd()*.4,c:col});
  }
  S.fx.push({t:'txt',x:x,y:y-24,txt:'+'+gain+(chain>1?' x'+chain:''),age:0,life:.9,c:'#fff6cf',sz:15+Math.min(13,chain*2)});
}
function handleMerges(){
  var ms=S.ev.merges; if(!ms||!ms.length) return;
  for(var i=0;i<ms.length;i++){
    var m=ms[i];
    S.chain++; S.chainT=1.0; S.merges++;
    var gain=(m.lv*(m.lv+1))/2*S.chain;
    S.score+=gain;
    if(!seen[m.lv]){ seen[m.lv]=1; saveSeen(); }     /* 图鉴点亮 */
    if(m.lv>=CHAIN.length-1){ S.score+=500; addFx(m.x,m.y,m.lv,500,S.chain); S.shake=1; toast('🐲 龙王降临！+500'); }
    S.shake=Math.min(1,S.shake+.2+m.lv*.03);
    addFx(m.x,m.y,m.lv,gain,S.chain);
    sfx.merge(m.lv,S.chain);
  }
  updateHud();
}
function stepFx(dt){
  for(var i=S.fx.length-1;i>=0;i--){
    var f=S.fx[i]; f.age+=dt;
    if(f.t==='p'){ f.vy+=900*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; }
    if(f.age>=f.life) S.fx.splice(i,1);
  }
}
function aliveBalls(){ return S?S.balls.length:0; }

function clearLevel(){
  S.frozen=true; sfx.clear();
  var bonus=S.taps*15, perfect=(S.balls.length<=1);   /* 省下的敲击换分，但不能盖过本关得分 */
  var playScore=S.score;                              /* 星级只看敲出来的分，不算奖励 */
  var ratio=playScore/Math.max(1,S.target);
  var star=ratio>=2.4?3:(ratio>=1.6?2:1);
  S.stars=star;
  S.score+=bonus;
  if(S.mode!=='daily'&&S.level+1>bestLevel){ bestLevel=Math.min(TOTAL_LEVELS,S.level+1); LS.set('zz_best',bestLevel); }
  if(S.mode!=='daily'&&(!stars[S.level]||stars[S.level]<star)){ stars[S.level]=star; saveStars(); }
  if(S.mode==='daily'){
    var k=todayKey(), r=LS.get('zz_daily',{});
    if(!r[k]||r[k]<S.score){ r[k]=S.score; LS.set('zz_daily',r); }
  }
  updateHud();
  var tail='<br>省下 '+S.taps+' 次敲击 → 奖励 <b>+'+bonus+'</b>'+(perfect?'<br>🧹 <b>整堆敲平了！</b>':'');
  var last=(S.mode!=='daily'&&S.level>=TOTAL_LEVELS);
  if(last){
    var mx=0,i;
    for(i=0;i<S.balls.length;i++) mx=Math.max(mx,S.balls[i].lv);
    showCard({
      title:'🏆 '+TOTAL_LEVELS+' 关全敲穿！',
      sub:'总分 '+S.score+' 分 · 最后剩下一只 '+CHAIN[mx].e,
      body:'你把 '+TOTAL_LEVELS+' 关全部敲穿了，最后一关的记录会一直留在首页。'+tail,
      buttons:[{label:'选关刷星',cls:'btn',fn:levelSelect},
               {label:'看萌兽图鉴',cls:'btn ghost',fn:gallery},
               {label:'炫耀一下成绩',cls:'btn ghost',fn:share}]
    });
    return;
  }
  var starTxt='★'.repeat(star)+'☆'.repeat(3-star);
  showCard({
    title:'🎉 第 '+S.level+' 关敲穿',
    sub:starTxt+'　得分 '+S.score+'（敲击 '+playScore+' + 奖励 '+bonus+'）',
    body:'目标 '+S.target+' 分，达成 <b>'+ratio.toFixed(2)+' 倍</b>。'+tail,
    buttons:[{label:'下一关 ▶',cls:'btn',fn:function(){ startLevel(S.level+1,'campaign'); }},
             {label:'选关刷星',cls:'btn ghost',fn:levelSelect},
             {label:'炫耀一下成绩',cls:'btn ghost',fn:share}]
  });
}
function failLevel(){
  S.frozen=true; sfx.fail();
  showCard({
    title:'锤子用完了 🔨',
    sub:'分数 '+S.score+' / 目标 '+S.target+' · 差 '+(S.target-S.score)+' 分',
    body:'小技巧：落点放在<b>同款最密的地方</b>，波前会一次掀翻好几只，撞在一起就成了连锁；'+
         '留着的敲击次数每次还能换 220 分。',
    buttons:[{label:'再敲一次 ▶',cls:'btn',fn:function(){ startLevel(S.level,S.mode); }},
             {label:'回到首页',cls:'btn ghost',fn:home},
             {label:'炫耀一下成绩',cls:'btn ghost',fn:share}]
  });
}

/* ================= 主循环 ================= */
var last=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=(ts-last)/1000; last=ts;
  if(!isFinite(dt)||dt<=0) dt=1/60;
  if(dt>0.05) dt=0.05;
  if(S&&!S.over&&!S.frozen){
    acc+=dt; var guard=0;
    while(acc>=1/120&&guard++<14){
      stepWaves(1/120);
      FIELD.MERGE_V_NOW=(S.mergeBoost>0?FIELD.MERGE_V*0.32:FIELD.MERGE_V);   /* 磁锤期间轻碰也能合体 */
      physicsStep(S.balls,1/120,S.ev,true);
      handleMerges();
      acc-=1/120;
    }
    S.t+=dt;
    if(S.mergeBoost>0) S.mergeBoost-=dt;
    if(S.chainT>0){ S.chainT-=dt; if(S.chainT<=0&&S.chain>0){ S.chain=0; updateHud(); } }
    deOverlap(S.balls,2);                            /* 每帧顺手把挤在一起的球推开一点 */
    if(S.shake>0) S.shake=Math.max(0,S.shake-dt*3.0);
    stepFx(dt);
    if(S.score>=S.target){ S.endT+=dt; if(S.endT>0.85) clearLevel(); }
    else if(S.taps<=0){
      S.endT+=dt;
      if(settled(S.balls,50)||S.endT>2.8){
        if(S.score>=S.target) clearLevel(); else failLevel();
      }
    } else S.endT=0;
  }
  draw();
}

/* ================= 绘制 ================= */
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBall(b,alpha){
  var sq=1+b.squash*.22;
  ctx.save(); ctx.translate(b.x,b.y); ctx.scale(sq,1/sq); ctx.globalAlpha=alpha==null?1:alpha;
  var g=ctx.createRadialGradient(-b.r*.34,-b.r*.4,b.r*.12,0,0,b.r*1.06);
  g.addColorStop(0,'#ffffff'); g.addColorStop(.28,CHAIN[b.lv].c1); g.addColorStop(1,CHAIN[b.lv].c2);
  ctx.beginPath(); ctx.arc(0,0,b.r,0,6.2832); ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=Math.max(1,b.r*.07); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.stroke();
  ctx.font=Math.round(b.r*1.18)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.save(); ctx.rotate(Math.max(-.45,Math.min(.45,b.spin))); ctx.fillText(CHAIN[b.lv].e,0,b.r*.06); ctx.restore();
  ctx.restore();
}
function avgY(){ var s=0,i; for(i=0;i<S.balls.length;i++) s+=S.balls[i].y; return s/S.balls.length; }
function draw(){
  ctx.save();
  ctx.clearRect(0,0,FIELD.W,FIELD.H);
  var g=ctx.createLinearGradient(0,0,0,FIELD.H);
  g.addColorStop(0,'#201a3d'); g.addColorStop(1,'#140f2a');
  roundRect(FIELD.WALL,FIELD.WALL,FIELD.W-FIELD.WALL*2,FIELD.H-FIELD.WALL*2,20);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.13)'; ctx.lineWidth=2; ctx.stroke();
  if(S){
    if(S.shake>0) ctx.translate((rnd()-.5)*14*S.shake,(rnd()-.5)*14*S.shake);
    for(var w=0;w<S.waves.length;w++){
      var wv=S.waves[w], p=wv.r/wv.max;
      var col=wv.kind==='heavy'?'255,145,60':(wv.kind==='magnet'?'110,230,255':'255,236,180');
      ctx.save();
      if(wv.kind==='magnet') ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.arc(wv.x,wv.y,wv.r,0,6.2832);
      ctx.lineWidth=Math.max(1.5,(wv.kind==='heavy'?13:9)*(1-p));
      ctx.strokeStyle='rgba('+col+','+(0.85*(1-p))+')'; ctx.stroke();
      ctx.beginPath(); ctx.arc(wv.x,wv.y,wv.r*(wv.kind==='heavy'?0.6:0.72),0,6.2832);
      ctx.lineWidth=2; ctx.strokeStyle='rgba('+col+','+(0.4*(1-p))+')'; ctx.stroke();
      ctx.restore();
    }
    for(var i=0;i<S.balls.length;i++) drawBall(S.balls[i]);
    for(var k=0;k<S.fx.length;k++){
      var f=S.fx[k], pp=f.age/f.life;
      if(f.t==='ring'){
        ctx.beginPath(); ctx.arc(f.x,f.y,f.r+(f.max-f.r)*pp,0,6.2832);
        ctx.lineWidth=3.5*(1-pp); ctx.strokeStyle=f.c; ctx.globalAlpha=1-pp; ctx.stroke(); ctx.globalAlpha=1;
      }else if(f.t==='p'){
        ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1-pp*.6),0,6.2832);
        ctx.fillStyle=f.c; ctx.globalAlpha=1-pp; ctx.fill(); ctx.globalAlpha=1;
      }else{
        ctx.font='bold '+f.sz+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.globalAlpha=1-pp; ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillText(f.txt,f.x+1.5,f.y-pp*26+1.5);
        ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y-pp*26); ctx.globalAlpha=1;
      }
    }
    if(!S.frozen&&(S.taps>0||S.armed)){
      var ac2=S.armed==='heavy'?'255,160,80':(S.armed==='magnet'?'120,235,255':'255,255,255');
      ctx.save();
      ctx.beginPath(); ctx.arc(aim.x,aim.y,16,0,6.2832);
      ctx.setLineDash([5,6]); ctx.lineWidth=2; ctx.strokeStyle='rgba('+ac2+',.6)'; ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(aim.x,aim.y,3,0,6.2832); ctx.fillStyle='rgba('+ac2+',.9)'; ctx.fill();
      ctx.restore();
    }
    if(S.tapsUsed===0&&S.level===1&&S.t<8){
      ctx.save();
      ctx.font='bold 15px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha=0.55+0.45*Math.abs(Math.sin(S.t*2));
      ctx.fillStyle='#ffe9a8';
      ctx.fillText('点这里敲一下 🔨',FIELD.W/2,avgY()-70);
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ================= 弹窗 / 分享 ================= */
function showCard(o){
  card.innerHTML='<h1>'+o.title+'</h1>'+(o.sub?'<p class="sub">'+o.sub+'</p>':'')+(o.body?'<p>'+o.body+'</p>':'');
  var box=document.createElement('div');
  for(var i=0;i<o.buttons.length;i++){
    (function(bt){
      var el=document.createElement('button');
      el.className=bt.cls||'btn'; el.textContent=bt.label;
      el.addEventListener('click',function(){ ac(); bt.fn(); });
      box.appendChild(el);
    })(o.buttons[i]);
  }
  card.appendChild(box);
  overlay.classList.add('show');
}
function hideCard(){ overlay.classList.remove('show'); }
var toastEl=null, toastTimer=null;
function toast(msg){
  if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl); }
  toastEl.textContent=msg; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ toastEl.classList.remove('show'); },1000);
}
function share(){
  var txt='我在《震震萌兽》用 '+(S?S.tapsUsed:0)+' 下锤子敲出 '+(S?S.score:0)+' 分（第 '+(S?S.level:1)+' 关）。一敲全塌，你来试试？';
  if(navigator.share){ navigator.share({title:'震震萌兽',text:txt}).catch(function(){}); return; }
  var done=function(){ toast('成绩已复制，快去炫耀！'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,function(){ fb(txt,done); }); }
  else fb(txt,done);
}
function fb(txt,cb){
  var ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast(txt); }
  document.body.removeChild(ta);
}

/* ================= 输入 ================= */
function toField(clientX,clientY){
  var r=cv.getBoundingClientRect();
  if(!r.width) return null;
  return {x:(clientX-r.left)/r.width*FIELD.W,y:(clientY-r.top)/r.height*FIELD.H};
}
stage.addEventListener('pointermove',function(e){
  var p=toField(e.clientX,e.clientY); if(p){ aim.x=Math.max(4,Math.min(FIELD.W-4,p.x)); aim.y=Math.max(4,Math.min(FIELD.H-4,p.y)); }
});
stage.addEventListener('pointerdown',function(e){
  ac();
  var p=toField(e.clientX,e.clientY); if(p){ aim.x=p.x; aim.y=p.y; knock(p.x,p.y); }
  e.preventDefault();
});
stage.addEventListener('contextmenu',function(e){ e.preventDefault(); });
document.addEventListener('touchstart',function(){ ac(); },{passive:true});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
document.addEventListener('keydown',function(e){
  if(!S) return;
  var step=18;
  if(e.key==='ArrowLeft'){ aim.x=Math.max(4,aim.x-step); e.preventDefault(); }
  if(e.key==='ArrowRight'){ aim.x=Math.min(FIELD.W-4,aim.x+step); e.preventDefault(); }
  if(e.key==='ArrowUp'){ aim.y=Math.max(4,aim.y-step); e.preventDefault(); }
  if(e.key==='ArrowDown'){ aim.y=Math.min(FIELD.H-4,aim.y+step); e.preventDefault(); }
  if(e.key===' '||e.key==='Enter'){ knock(aim.x,aim.y); e.preventDefault(); }
  if(e.key==='1'){ armTool('heavy'); e.preventDefault(); }
  if(e.key==='2'){ armTool('magnet'); e.preventDefault(); }
  if(e.key==='r'||e.key==='R') startLevel(S.level,S.mode);
});
/* 特殊锤：点一下"装上"，下一次敲击就用它 */
function armTool(kind){
  if(!S||S.over||S.frozen) return;
  if(kind==='heavy'&&S.heavy<=0) return;
  if(kind==='magnet'&&S.magnet<=0) return;
  S.armed=(S.armed===kind)?null:kind;
  ac(); updateHud();
  toast(S.armed?(kind==='heavy'?'💥 重锤已装上，敲下去！':'🧲 磁锤已装上，敲下去！'):'已取消');
}
btnHeavy.addEventListener('click',function(){ armTool('heavy'); });
btnMagnet.addEventListener('click',function(){ armTool('magnet'); });

function home(){

  for(i=1;i<=TOTAL_LEVELS;i++){ totalStars+=(stars[i]||0); }
  var btns=[
    {label:(bestLevel>1?'继续第 '+bestLevel+' 关 ▶':'开始第 1 关 ▶'),cls:'btn',fn:function(){ startLevel(bestLevel,'campaign'); }},
    {label:'🗺️ 选关刷星（★'+totalStars+'/'+(TOTAL_LEVELS*3)+'）',cls:'btn ghost',fn:levelSelect},
    {label:'📖 萌兽图鉴（'+got+'/'+CHAIN.length+'）',cls:'btn ghost',fn:gallery},
    {label:'🔥 今日挑战'+(ds?'（今日 '+ds+' 分）':''),cls:'btn ghost',fn:startDaily}
  ];
  if(bestLevel>1) btns.push({label:'从第 1 关重敲',cls:'btn ghost',fn:function(){ bestLevel=1; LS.set('zz_best',1); startLevel(1,'campaign'); }});
  showCard({
    title:'🔨 震震萌兽',
    sub:'一敲全塌 · 冲击波连锁合成',
    body:'<div class="rules">'+
      '1️⃣ 在萌兽堆上<b>敲一下</b>，冲击波从落点扩散开<br>'+
      '2️⃣ 波前扫到的萌兽会被掀起来乱撞<br>'+
      '3️⃣ <b>撞得够狠</b>的同款才会合体（轻轻靠着不算）<br>'+
      '4️⃣ 敲击次数有限，分数到目标就过关<br>'+
      '5️⃣ 每关还有 <b>💥重锤</b> 和 <b>🧲磁锤</b> 各一次，别浪费<br>'+
      '6️⃣ 达成 1.6 倍目标给 2 星、2.4 倍给 3 星</div>'+
      '<div class="ladder">'+ladder+'</div>',
    buttons:btns
  });
}

/* ================= 选关 / 图鉴 ================= */
function levelSelect(){
  var cells='',i;
  for(i=1;i<=TOTAL_LEVELS;i++){
    var locked=(i>bestLevel), st=stars[i]||0;
    cells+='<button class="cell'+(locked?' locked':'')+(st===3?' best':'')+'" data-lv="'+i+'"'+(locked?' disabled':'')+'>'+
      (locked?'🔒':i)+'<small>'+(locked?'':'★'.repeat(st)+'☆'.repeat(3-st))+'</small></button>';
  }
  showCard({
    title:'🗺️ 选择关卡',
    sub:'已解锁 ' + bestLevel + '/' + TOTAL_LEVELS + ' 关 · 星星可以重打刷新',
    body:'<div class="grid">'+cells+'</div>',
    buttons:[{label:'回到首页',cls:'btn ghost',fn:home}]
  });
  var btns=card.querySelectorAll('.cell[data-lv]');
  for(i=0;i<btns.length;i++){
    (function(el){
      el.addEventListener('click',function(){
        ac();
        var lv=parseInt(el.getAttribute('data-lv'),10);
        if(lv>bestLevel) return;
        startLevel(lv,'campaign');
      });
    })(btns[i]);
  }
}
function gallery(){
  var html='',i,got=0;
  for(i=0;i<CHAIN.length;i++){
    var has=!!seen[i]; if(has) got++;
    html+='<div class="'+(has?'has':'')+'" title="'+CHAIN[i].r+'px">'+CHAIN[i].e+'</div>';
  }
  var dragon=seen[CHAIN.length-1];
  showCard({
    title:'📖 萌兽图鉴',
    sub:'已点亮 '+got+'/'+CHAIN.length+(dragon?' · 🐲 龙王已现世！':' · 🐲 龙王还没出现'),
    body:'<div class="gal">'+html+'</div><div class="hint">合出来的萌兽会永久点亮（存在本机）。越往后越大只，龙王要靠 5 关以后的大堆才敲得出来。</div>',
    buttons:[{label:'回到首页',cls:'btn ghost',fn:home},
             {label:'选关刷星',cls:'btn ghost',fn:levelSelect}]
  });
}

/* ================= 自动敲击（?auto=1，给冒烟测试用） ================= */
(function(){
  if(location.search.indexOf('auto')<0) return;
  var lv=(location.search.match(/lv=(\d+)/)||[])[1];
  setTimeout(function(){
    startLevel(lv?parseInt(lv,10):1,'campaign');
    setInterval(function(){
      if(!S) return;
      if(S.frozen||S.over){
        document.title='AUTO 结束 L'+S.level+' 分'+S.score+'/目标'+S.target+' 敲'+S.tapsUsed+' 合成'+S.merges+' 球'+S.balls.length;
        return;
      }
      var bestP=null,bestV=-1,i,j;
      for(i=0;i<S.balls.length;i++){
        var a=S.balls[i],v=0;
        for(j=0;j<S.balls.length;j++){
          if(i===j) continue;
          var b=S.balls[j]; if(b.lv!==a.lv) continue;
          var d=Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
          v+=Math.max(0,1-d/190);
        }
        if(v>bestV){ bestV=v; bestP={x:a.x,y:a.y}; }
      }
      if(bestP) knock(bestP.x,bestP.y);
      document.title='AUTO L'+S.level+' 分'+S.score+'/目标'+S.target+' 敲'+S.tapsUsed+' 剩'+S.taps+' 合成'+S.merges+' 球'+S.balls.length;
    },520);
  },500);
})();

/* ================= 启动 ================= */
btnSound.textContent=soundOn?'🔊':'🔇';
fit();
home();
requestAnimationFrame(frame);
})();
</script>
